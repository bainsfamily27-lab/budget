<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bains Family Financials</title>

<style>
/* ─── DESIGN TOKENS ─────────────────────────────────── */
:root {
  --bg:          #f5f6f7;
  --surface:     #ffffff;
  --surface2:    #f0f1f3;
  --border:      rgba(0,0,0,0.08);
  --border2:     rgba(0,0,0,0.16);
  --text:        #0a0b0d;
  --muted:       #5a5d66;
  --accent:      #2563eb;
  --accent-dim:  rgba(37,99,235,0.08);
  --green:       #16a34a;
  --green-dim:   rgba(22,163,74,0.08);
  --amber:       #d97706;
  --amber-dim:   rgba(217,119,6,0.08);
  --red:         #dc2626;
  --red-dim:     rgba(220,38,38,0.08);
  --font-head:   'Plus Jakarta Sans', sans-serif;
  --font-body:   'Inter', sans-serif;
  --radius:      10px;
  --radius-sm:   6px;
  --shadow:      0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
}

/* ─── RESET ──────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--font-body);
  font-size: 14px;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-text-size-adjust: 100%;
}

/* ─── KEYFRAMES ──────────────────────────────────────── */
@keyframes spin    { to { transform: rotate(360deg); } }
@keyframes fadeUp  { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
@keyframes fadeIn  { from { opacity:0; } to { opacity:1; } }

/* ─── SITE HEADER ────────────────────────────────────── */
.site-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 1.5rem;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  box-shadow: var(--shadow);
}
.site-header-left  { display: flex; align-items: center; gap: 10px; }
.site-header-right { display: flex; align-items: center; gap: 12px; }
.site-title {
  font-family: var(--font-head);
  font-weight: 700;
  font-size: 1rem;
  color: var(--accent);
  letter-spacing: -0.01em;
}
.site-badge {
  font-size: 0.65rem;
  font-weight: 600;
  background: var(--accent-dim);
  color: var(--accent);
  border: 1px solid rgba(37,99,235,0.2);
  padding: 2px 8px;
  border-radius: 20px;
  letter-spacing: 0.04em;
}
#header-nw {
  font-family: var(--font-head);
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--green);
}

/* ─── MAIN WRAPPER ───────────────────────────────────── */
main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 24px 20px 60px;
}

/* ─── SECTION LABELS ─────────────────────────────────── */
.sec-label {
  font-size: 0.68rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.sec-label::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border2);
}

/* ─── CARDS ──────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  animation: fadeUp 0.3s ease both;
}
.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
  flex-wrap: wrap;
  gap: 8px;
}
.card-header-title {
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--muted);
}

/* ─── BADGES ─────────────────────────────────────────── */
.badge {
  display: inline-block;
  font-size: 0.65rem;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: 20px;
  letter-spacing: 0.02em;
}
.badge-green  { background: var(--green-dim);  color: #15803d; border: 1px solid rgba(22,163,74,0.25); }
.badge-blue   { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(37,99,235,0.2); }
.badge-amber  { background: var(--amber-dim);  color: #b45309; border: 1px solid rgba(217,119,6,0.25); }
.badge-red    { background: var(--red-dim);    color: #b91c1c; border: 1px solid rgba(220,38,38,0.25); }
.badge-muted  { background: rgba(0,0,0,0.05);  color: var(--muted); border: 1px solid var(--border2); }

/* ─── BUTTONS ────────────────────────────────────────── */
.btn {
  font-family: var(--font-body);
  font-size: 0.75rem;
  font-weight: 600;
  padding: 5px 14px;
  border-radius: 20px;
  border: 1px solid var(--border2);
  background: var(--surface2);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; color: #fff; }
.btn-success { background: var(--green); border-color: var(--green); color: #fff; }
.btn-danger  { color: var(--red); border-color: rgba(220,38,38,0.3); background: var(--red-dim); }

/* ─── INPUTS ─────────────────────────────────────────── */
input[type="text"],
input[type="number"],
input[type="password"] {
  font-family: var(--font-body);
  font-size: 16px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  color: var(--text);
  padding: 8px 12px;
  outline: none;
  width: 100%;
  transition: border-color 0.15s, background 0.15s;
  -webkit-appearance: none;
}
input:focus { border-color: rgba(37,99,235,0.5); background: var(--surface); }
input[type="number"] { -moz-appearance: textfield; }
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

/* ─── SPINNER ────────────────────────────────────────── */
.spinner {
  width: 24px; height: 24px;
  border: 3px solid var(--border2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  flex-shrink: 0;
}
.spinner-sm { width: 14px; height: 14px; border-width: 2px; }

/* ─── EDIT PASSWORD MODAL ────────────────────────────── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10,11,13,0.55);
  backdrop-filter: blur(3px);
  z-index: 999;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  animation: fadeIn 0.2s ease;
}
.modal-box {
  background: var(--surface);
  border-radius: 14px;
  padding: 28px;
  width: 100%;
  max-width: 340px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.18);
  animation: fadeUp 0.2s ease;
}
.modal-title { font-family: var(--font-head); font-weight: 700; font-size: 1rem; color: var(--text); margin-bottom: 4px; }
.modal-sub   { font-size: 0.75rem; color: var(--muted); margin-bottom: 20px; }
.modal-label { font-size: 0.68rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
.modal-error { font-size: 0.72rem; color: var(--red); margin-top: 6px; min-height: 16px; }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; }
.modal-btn {
  flex: 1;
  padding: 10px;
  font-family: var(--font-head);
  font-size: 0.85rem;
  font-weight: 700;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.15s;
}
.modal-btn-primary { background: var(--accent); color: #fff; }
.modal-btn-primary:hover { background: #1d4ed8; }
.modal-btn-cancel  { background: var(--surface2); color: var(--muted); border: 1px solid var(--border2); flex: 0 0 auto; padding: 10px 16px; }

/* ─── STAT STRIP ─────────────────────────────────────── */
.stat-strip {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 4px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  margin-bottom: 24px;
}
.stat-strip::-webkit-scrollbar { display: none; }
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  min-width: 130px;
  flex-shrink: 0;
  box-shadow: var(--shadow);
}
.stat-card-label { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 5px; white-space: nowrap; }
.stat-card-val   { font-family: var(--font-head); font-size: 1.1rem; font-weight: 700; color: var(--text); line-height: 1; }
.stat-card-sub   { font-size: 0.65rem; color: var(--muted); margin-top: 4px; }

/* ─── SECTION WRAP ───────────────────────────────────── */
.section-wrap { margin-bottom: 28px; }

/* ─── LOADING ────────────────────────────────────────── */
.loading-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 60vh;
  gap: 14px;
}
.loading-screen p { font-size: 13px; color: var(--muted); }

/* ─── RESPONSIVE ─────────────────────────────────────── */
@media (max-width: 900px) { main { padding: 16px 16px 48px; } }
@media (max-width: 600px) {
  main { padding: 12px 12px 40px; }
  .site-header { padding: 0 1rem; }
  .site-title { font-size: 0.9rem; }
}
@media (max-width: 400px) { main { padding: 10px 10px 32px; } }
</style>
</head>

<!-- ── SITE HEADER ──────────────────────────────────── -->
<header class="site-header">
  <div class="site-header-left">

<!-- ── EDIT PASSWORD MODAL (for editing only) ───────── -->
<div id="edit-modal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <div class="modal-title">Edit Mode</div>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════
   1. FIREBASE
═══════════════════════════════════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyAyP4XFRDcP7Uutac_bYq5oo97CU4lrPCs",
  authDomain:        "house-budget-67248.firebaseapp.com",
  projectId:         "house-budget-67248",
  storageBucket:     "house-budget-67248.firebasestorage.app",
  messagingSenderId: "860923969797",
  appId:             "1:860923969797:web:8bb95e65eccfe492ab776c"
};

let db;
try {
  firebase.initializeApp(FIREBASE_CONFIG);
  db = firebase.firestore();
  console.log('✅ Firebase connected');
} catch (e) {
  console.error('Firebase init failed:', e);
}

/* ═══════════════════════════════════════════════════════
   2. EDIT PASSWORD  (view is open — edit requires pwd)
═══════════════════════════════════════════════════════ */
const EDIT_PASSWORD = 'ajax123';
let   editUnlocked  = false;
let   _editCallback = null;

function requirePassword(cb) {
  if (editUnlocked) { cb(); return; }
  _editCallback = cb;
  const modal = document.getElementById('edit-modal');
  modal.style.display = 'flex';
  setTimeout(() => document.getElementById('edit-pwd-input').focus(), 80);
}

function submitEditPassword() {
  const val = document.getElementById('edit-pwd-input').value;
  const err = document.getElementById('edit-pwd-error');
  if (val === EDIT_PASSWORD) {
    editUnlocked = true;
    closeEditModal();
    if (_editCallback) { _editCallback(); _editCallback = null; }
  } else {
    err.textContent = 'Incorrect password';
    document.getElementById('edit-pwd-input').value = '';
    document.getElementById('edit-pwd-input').focus();
  }
}

function closeEditModal() {
  document.getElementById('edit-modal').style.display = 'none';
  document.getElementById('edit-pwd-input').value = '';
  document.getElementById('edit-pwd-error').textContent = '';
  _editCallback = null;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeEditModal();
});

/* ═══════════════════════════════════════════════════════
   3. UTILITIES
═══════════════════════════════════════════════════════ */
const $        = id => document.getElementById(id);
const fmtCAD   = n  => '$' + Math.round(n).toLocaleString('en-CA');
const fmtCAD2  = n  => '$' + Number(n).toLocaleString('en-CA', { minimumFractionDigits:2, maximumFractionDigits:2 });
const fmtCAD3  = n  => '$' + Number(n).toLocaleString('en-CA', { minimumFractionDigits:2, maximumFractionDigits:3 });
const sanitize = s  => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

function showSaved(elId) {
  const el = $(elId);
  if (!el) return;
  el.style.opacity = '1';
  setTimeout(() => { el.style.opacity = '0'; }, 2200);
}

/* ═══════════════════════════════════════════════════════
   4. FIREBASE HELPERS
═══════════════════════════════════════════════════════ */
const FB_TIMEOUT = 6000;

function fbGet(path) {
  const [col, doc] = path.split('/');
  return Promise.race([
    db.collection(col).doc(doc).get(),
    new Promise((_, r) => setTimeout(() => r(new Error('timeout')), FB_TIMEOUT))
  ]);
}

function fbSet(path, data, merge = true) {
  const [col, doc] = path.split('/');
  return db.collection(col).doc(doc).set(data, { merge });
}

/* ═══════════════════════════════════════════════════════
   5. APP STATE
═══════════════════════════════════════════════════════ */
const STATE = {
  budget:   null,
  fs:       null,
  rp:       null,
  wf:       null,
  settings: null,
};

/* ═══════════════════════════════════════════════════════
   6. LOAD ALL DATA
═══════════════════════════════════════════════════════ */
async function loadAll() {
  async function safeGet(path) {
    try {
      const snap = await fbGet(path);
      return snap.exists ? snap.data() : null;
    } catch (e) {
      console.warn('loadAll:', path, e.message);
      return null;
    }
  }

  const [budget, fs, rp, wf, settings] = await Promise.all([
    safeGet('budget/main'),
    safeGet('budget/financialsummary'),
    safeGet('budget/retirementplan'),
    safeGet('budget/weddingfund'),
    safeGet('budget/settings'),
  ]);

  STATE.budget   = budget;
  STATE.fs       = fs;
  STATE.rp       = rp;
  STATE.wf       = wf;
  STATE.settings = settings;

  console.log('✅ Data loaded', {
    budget: !!budget, fs: !!fs, rp: !!rp, wf: !!wf, settings: !!settings
  });
}

/* ═══════════════════════════════════════════════════════
   7. SHELL — renders after data loads
═══════════════════════════════════════════════════════ */
function renderShell() {
  $('main-content').innerHTML = `
    <div id="strip-wrap"></div>
    <div id="sections-root"></div>
  `;
  console.log('✅ Shell ready — add sections here');
}

/* ═══════════════════════════════════════════════════════
   8. BOOT — loads data, renders shell, no password needed
═══════════════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', async () => {
  window.scrollTo(0, 0);
  await loadAll();
  renderShell();
});
</script>

<!-- ── PORTFOLIO TRACKER ──────────────────────────── -->
<script>
'use strict';

/* ─── DEFAULT DATA ─────────────────────────────────── */
const PT_DEFAULT = [
  { id:'newton-btc',     group:'financial',   accountType:'Crypto',                    location:'Newton',       holdings:[{ticker:'BTC-CAD',        name:'Bitcoin',                             qty:0,       qtyLabel:'BTC'}] },
  { id:'td-tfsa-manny',  group:'financial',   accountType:'TFSA (Manny)',              location:'TD',           holdings:[{ticker:'XEQT.TO',         name:'iShares Core Equity ETF',             qty:256,     qtyLabel:'shares'}] },
  { id:'cibc-tfsa-rani', group:'financial',   accountType:'TFSA (Rani)',               location:'CIBC',         holdings:[{ticker:'0P000070BP.TO',   name:'CIBC Balanced Index Fund CL A',       qty:413.487, qtyLabel:'units'}] },
  { id:'cibc-resp',      group:'financial',   accountType:'RESP (Noor & Veer)',        location:'CIBC',         holdings:[
    {ticker:'0P000070BP.TO', name:'CIBC Balanced Index Fund CL A',         qty:780.932,  qtyLabel:'units'},
    {ticker:'0P000071B4.TO', name:'CIBC Nasdaq Index Fund CL A',           qty:174.738,  qtyLabel:'units'},
    {ticker:'0P000071JF.TO', name:'CIBC U.S. Broad Market Index Fund CL A',qty:124.736,  qtyLabel:'units'}
  ]},
  { id:'rbc-rrsp-manny', group:'financial',   accountType:'RRSP (Manny)',              location:'RBC',          holdings:[
    {ticker:'0P000070AD.TO', name:'RBC U.S. Index Fund DZ',           qty:954.408,  qtyLabel:'units'},
    {ticker:'0P00007069.TO', name:'RBC Select Growth Portfolio A',    qty:15.915,   qtyLabel:'units'},
    {ticker:'0P0001OCCA.TO', name:'RBC Global Bond Index ETF Fund D', qty:1244.128, qtyLabel:'units'}
  ]},
  { id:'woodstock', group:'real_estate',
    accountType:'Rental Property (1/3 share)', location:'Woodstock, ON',
    propertyValue:216667, mortgageBalance:169175,
    rate:3.84, monthlyPayment:862, payoffDate:'Jan 2052',
    note:'Your 1/3 of $650K property · full mortgage $507,524'
  }
];

/* ─── STATE ─────────────────────────────────────────── */
let ptAccts    = JSON.parse(JSON.stringify(PT_DEFAULT));
let ptExpanded = false;
let ptEditMode = false;
let ptFetching = false;
const ptCache  = {};
const PT_TTL   = 300000;

/* ─── PRICE FETCHING via Google Apps Script ─────────────
   Replace SCRIPT_URL below with your deployed Web App URL.
   Server-side fetch = no CORS issues = reliable prices.
─────────────────────────────────────────────────────── */
const PT_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx5jtDlIxYkserWXUaUbvq-UXUH_cVdcoUYKOKII4FmTrGYf1jWwfkjdF0dnemNYPnawQ/exec';

async function ptFetchAll() {
  if (ptFetching) return;
  ptFetching = true;

  const all   = [...new Set(ptAccts.filter(a=>a.group==='financial').flatMap(a=>a.holdings.map(h=>h.ticker)))];
  const stale = all.filter(t => { const c=ptCache[t]; return !c || Date.now()-c.ts > PT_TTL; });

  if (!stale.length) { ptFetching=false; return; }

  if (!PT_SCRIPT_URL || PT_SCRIPT_URL.includes('PASTE_YOUR')) {
    console.warn('⚠ Set PT_SCRIPT_URL to your Google Apps Script URL');
    ptFetching = false;
    return;
  }

  try {
    const url  = PT_SCRIPT_URL + '?action=prices&symbols=' + encodeURIComponent(stale.join(','));
    const ctrl = new AbortController();
    setTimeout(() => ctrl.abort(), 12000);
    const r    = await fetch(url, {signal:ctrl.signal, redirect:'follow'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const text = await r.text();
    const j    = JSON.parse(text);
    const prices = j.prices || {};
    Object.entries(prices).forEach(([ticker, data]) => {
      ptCache[ticker] = { ...data, ts: Date.now() };
    });
    console.log('✅ Prices from Google Apps Script —', Object.keys(prices).length, 'of', stale.length, 'tickers');
  } catch(e) {
    console.warn('⚠ Apps Script price fetch failed:', e.message);
    // Fallback: Coinbase directly for BTC (always works - no CORS issues)
    if (stale.includes('BTC-CAD')) {
      try {
        const ctrl2 = new AbortController();
        setTimeout(() => ctrl2.abort(), 5000);
        const r = await fetch('https://api.coinbase.com/v2/prices/BTC-CAD/spot', {signal:ctrl2.signal});
        const j = await r.json();
        const p = parseFloat(j.data.amount);
        if (p > 0) ptCache['BTC-CAD'] = {price:p, currency:'CAD', name:'Bitcoin', ts:Date.now()};
        console.log('✅ BTC from Coinbase fallback:', p);
      } catch(e2) {}
    }
  }

  ptFetching = false;
}

/* ─── CALCULATIONS ───────────────────────────────────── */
function ptHVal(h)   { const p=ptCache[h.ticker]; return (p&&h.qty>0)?p.price*h.qty:0; }
function ptAVal(acc) {
  if (acc.group==='real_estate') return Math.max(0,(acc.propertyValue||0)-(acc.mortgageBalance||0));
  return acc.holdings.reduce((s,h)=>s+ptHVal(h),0);
}
function ptGTotal(g) { return ptAccts.filter(a=>a.group===g).reduce((s,a)=>s+ptAVal(a),0); }

/* ─── FIREBASE ───────────────────────────────────────── */
async function ptLoad() {
  // Always use PT_DEFAULT — avoids conflicts with old Firebase data format
  // Quantities are hardcoded in PT_DEFAULT and updated via Edit → Save
  ptAccts = JSON.parse(JSON.stringify(PT_DEFAULT));
}

async function ptSaveFB() {
  try { await fbSet('budget/settings',{ptAccounts:ptAccts},true); showSaved('pt-saved'); }
  catch(e) { console.warn('ptSave failed',e); }
}

          display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:0.66rem;font-weight:700;text-transform:uppercase;letter-spacing:0.09em;color:var(--muted);">📊 Financial Investments</span>
          <span style="font-family:var(--font-head);font-size:0.9rem;font-weight:700;color:var(--text);">${fmtCAD(finTotal2)}</span>
        </div>
        ${finColHdr}
        ${finRows}
        ${addAccBtn}
        <div style="padding:9px 20px;background:rgba(22,163,74,0.04);border-bottom:1px solid var(--border);border-top:1px solid var(--border);
          display:flex;justify-content:space-between;align-items:center;">
          <span style="font-size:0.66rem;font-weight:700;text-transform:uppercase;letter-spacing:0.09em;color:var(--muted);">🏠 Real Estate Equity</span>
          <span style="font-family:var(--font-head);font-size:0.9rem;font-weight:700;color:var(--text);">${fmtCAD(reTotal)}</span>
        </div>
        ${reColHdr}
        ${reRows}
        ${footer}
      </div>
    </div>`;

  window.scrollTo(0, scrollY);
}

/* ─── ACTIONS ────────────────────────────────────────── */
function ptToggle() { ptExpanded=!ptExpanded; ptRender(); }

async function ptRefreshBtn(btn) {
  if (btn) { btn.textContent='…'; btn.disabled=true; }
  Object.values(ptCache).forEach(c=>{ c.ts=0; });
  await ptFetchAll();
  ptRender();
  if (btn) { btn.textContent='↻'; btn.disabled=false; }
}

async function ptDoneSave() {
  ptEditMode = false;
  ptRender();
  await ptSaveFB();
}

/* ─── RESPONSIVE CSS ─────────────────────────────────── */
const ptStyle = document.createElement('style');
ptStyle.textContent = `
  @media (max-width:600px) {
    #pt-root .pt-fin-grid  { grid-template-columns: 1fr 1.3fr 1fr !important; }
    #pt-root .pt-re-grid   { grid-template-columns: 1.5fr 1fr 1fr !important; }
  }
  @media (max-width:480px) {
    #pt-root [style*="grid-template-columns:1.2fr 1.5fr 1fr 1fr"]  { grid-template-columns:1fr 1fr 1fr !important; }
    #pt-root [style*="grid-template-columns:1.3fr 1fr 1fr 1fr"]    { grid-template-columns:1fr 1fr 1fr !important; }
    #pt-root [style*="grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px"] { grid-template-columns:1fr 1fr !important; }
  }
`;
document.head.appendChild(ptStyle);

/* ─── INIT ───────────────────────────────────────────── */
async function initPortfolioTracker() {
  const root = $('sections-root');
  if (!root) return;
  const wrap = document.createElement('div');
  wrap.className = 'section-wrap';
  wrap.innerHTML = '<div class="sec-label">Portfolio Tracker</div><div id="pt-root"></div>';
  root.appendChild(wrap);
  await ptLoad();
  ptRender();
  // Force re-render after 3s even if prices haven't loaded (shows real estate equity)
  setTimeout(() => ptRender(), 3000);
  ptFetchAll().then(() => ptRender());
}

const _origShell = window.renderShell;
window.renderShell = function() { _origShell(); initPortfolioTracker(); };
</script>
