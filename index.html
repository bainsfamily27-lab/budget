<style>

    --amber: #d97706;
    --amber-dim: rgba(217,119,6,0.08);
    --red: #dc2626;
    --red-dim: rgba(220,38,38,0.08);
    --purple: #7c3aed;
    --purple-dim: rgba(124,58,237,0.08);
    --font-head: 'Plus Jakarta Sans', sans-serif;
    --font-body: 'Inter', sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-body); font-weight: 400; background: var(--bg); color: var(--text); min-height: 100vh; padding: 0; }
  main { padding: 20px 20px 40px; max-width: 1200px; margin: 0 auto; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .site-header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 0; }
  .site-header h1 { font-family: var(--font-head); font-weight: 700; font-size: 1.1rem; color: var(--accent); }
  .site-header .sub { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
  .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 16px; animation: fadeUp 0.4s ease both; }
  .header h1 { font-family: var(--font-head); font-size: 1.4rem; font-weight: 700; color: var(--text); letter-spacing: -0.01em; line-height: 1; }
  .grand-total-val { font-family: var(--font-head); font-size: 2rem; font-weight: 800; color: var(--green); line-height: 1; text-align: right; }
  .grand-total-label { font-size: 11px; color: var(--muted); letter-spacing: 0.07em; text-transform: uppercase; margin-top: 4px; text-align: right; }
  .summary-grid { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 10px; margin-bottom: 20px; animation: fadeUp 0.4s 0.05s ease both; }
  .sum-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .sum-card-label { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 5px; font-weight: 600; }
  .sum-card-val { font-family: var(--font-head); font-size: 1.15rem; font-weight: 700; color: var(--text); line-height: 1; }
  .sum-card-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .toolbar { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-bottom: 12px; }
  .save-indicator { font-size: 12px; color: var(--green); opacity: 0; transition: opacity 0.3s; }

  .edit-btn { font-family: var(--font-body); font-size: 0.75rem; font-weight: 600; padding: 6px 14px; border-radius: 20px; cursor: pointer; letter-spacing: 0.02em; transition: all 0.2s; border: 1px solid var(--border2); background: var(--surface2); color: var(--muted); }
  .edit-btn.active { background: var(--accent-dim); border-color: rgba(37,99,235,0.3); color: var(--accent); }
  .main-grid { display: grid; grid-template-columns: 1fr 300px; gap: 20px; }
  .categories { display: flex; flex-direction: column; gap: 14px; }
  .section { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; animation: fadeUp 0.35s ease both; }
  .section-header { display: flex; align-items: center; justify-content: space-between; padding: 13px 15px; min-height: 44px; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; transition: background 0.15s; }
  .section-header:hover { background: var(--surface2); }
  .section-header.collapsed { border-bottom: none; }
  .section-title-wrap { display: flex; align-items: center; gap: 10px; }
  .section-icon { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .section-name { font-size: 13px; font-weight: 600; color: var(--text); font-family: var(--font-head); }
  .section-right { display: flex; align-items: center; gap: 12px; }
  .section-total { font-family: var(--font-head); font-size: 1rem; font-weight: 700; }
  .chevron { color: #888; font-size: 11px; transition: transform 0.2s; }
  .chevron.collapsed { transform: rotate(-90deg); }
  .section-body { padding: 4px 0; }
  .line-item { display: flex; align-items: center; justify-content: space-between; padding: 7px 15px; transition: background 0.1s; }
  .line-item:hover { background: var(--surface2); }
  .line-name { font-size: 13px; color: var(--text); font-weight: 500; }
  .line-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; margin-left: 12px; }
  .line-bar-wrap { width: 72px; height: 3px; background: rgba(0,0,0,0.07); border-radius: 2px; }
  .line-bar { height: 100%; border-radius: 2px; opacity: 0.55; }
  .line-amount { font-size: 13px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; min-width: 72px; text-align: right; font-family: var(--font-head); }
  .name-input, .amount-input { background: transparent; border: none; border-bottom: 1px solid var(--border2); font-family: var(--font-body); color: var(--text); outline: none; padding: 1px 0; font-size: 16px; }
  .name-input { font-size: 13px; flex: 1; min-width: 0; }
  .amount-input { font-size: 13px; font-weight: 600; width: 80px; text-align: right; }
  .name-input:focus, .amount-input:focus { border-bottom-color: var(--accent); }
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
  .remove-btn { background: none; border: none; cursor: pointer; color: var(--red); font-size: 16px; padding: 0 4px 0 0; line-height: 1; flex-shrink: 0; }
  .add-item-btn { width: calc(100% - 32px); margin: 6px 16px 10px; background: none; border: 1px dashed var(--border2); border-radius: 6px; font-size: 12px; color: var(--muted); cursor: pointer; padding: 5px 12px; text-align: left; font-family: var(--font-body); }
  .add-item-btn:hover { border-color: var(--accent); color: var(--accent); }
  .chart-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; position: sticky; top: 16px; align-self: start; animation: fadeUp 0.4s 0.1s ease both; }
  .chart-panel-label { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 14px; }
  .donut-wrap { position: relative; height: 200px; margin-bottom: 16px; }
  .legend { display: flex; flex-direction: column; gap: 7px; }
  .legend-item { display: flex; align-items: center; justify-content: space-between; font-size: 12px; }
  .legend-left { display: flex; align-items: center; gap: 7px; }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
  .legend-name { color: var(--muted); }
  .legend-val { font-weight: 600; color: #0d0d0b; font-variant-numeric: tabular-nums; }
  .sec-title { font-family: var(--font-head); font-size: 0.72rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .sec-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  @media (max-width: 480px) {
    main { padding: 10px 10px 24px; }
    body { padding: 0; }
    .summary-grid { grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .sum-card { padding: 10px 12px; }
    .sum-card-val { font-size: 1rem; }
    .rp-col-nominal { display: none !important; }
    .rp-portfolio-row { grid-template-columns: 2fr 1fr !important; }
    .rp-col-growth { display: none !important; }
    .line-bar-wrap { display: none !important; }
    .line-amount { min-width: 60px; }
    .grand-total-val { font-size: 1.7rem; }
    .modal-amount-inp { width: 90px !important; font-size: 15px !important; padding: 6px 8px !important; }
    .modal-row { padding: 8px 12px !important; gap: 8px !important; }
    .modal-row-name { font-size: 13px !important; }
    .sec-title { font-size: 1.2rem; }
    .modal-footer { flex-wrap: wrap; }
    .modal-grand { font-size: 12px; }
  }
  @media (max-width: 900px) {
    .main-grid { grid-template-columns: 1fr; }
    .summary-grid { grid-template-columns: repeat(3, 1fr); }

  @media (max-width: 600px) {
    main { padding: 12px 12px 32px; }
    body { padding: 0; }
    .header { flex-direction: column; align-items: flex-start; gap: 10px; }
    .header h1 { font-size: 1.6rem; }
    .grand-total-val { font-size: 1.9rem; }
    .summary-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .main-grid { grid-template-columns: 1fr; }
    .chart-panel { position: static; }
    .rp-col-nominal { display: none !important; }
    .rp-col-growth { display: none !important; }
    .rp-portfolio-row { grid-template-columns: 2fr 1fr !important; }
    .sec-title { font-size: 1.2rem; margin-bottom: 10px; }
    .modal-btn-save, .modal-btn-cancel { padding: 10px 14px; font-size: 13px; }
    .modal-footer { gap: 8px; padding: 10px 14px; }
  }
  .tfsa-col-price { }
  @media (max-width: 600px) { .tfsa-col-price { display: none !important; } }
  @media (max-width: 400px) {
    main { padding: 8px 8px 20px; }
    body { padding: 0; }
    .header h1 { font-size: 1.4rem; }
    .grand-total-val { font-size: 1.5rem; }
    .sum-card-val { font-size: 0.9rem; }
    .section-name { font-size: 12px; }
    .section-total { font-size: 0.95rem; }
    .modal-amount-inp { width: 80px !important; font-size: 14px !important; }
    .modal-row-name { font-size: 12px !important; }
  }
  /* Unified Edit Modal */
  .modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:flex;align-items:flex-end;justify-content:center; }
  @media(min-width:600px){.modal-overlay{align-items:center;padding:16px;}}
  .modal-box { background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:540px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -8px 40px rgba(0,0,0,0.2); }
  @media(min-width:600px){.modal-box{border-radius:16px;max-height:88vh;}}
  .modal-header { padding:16px 20px 14px;border-bottom:1px solid rgba(0,0,0,0.08);display:flex;justify-content:space-between;align-items:center;flex-shrink:0; }
  .modal-title { font-family:var(--font-head);font-size:1.1rem;font-weight:700;color:var(--text); }
  .modal-close { background:var(--surface2);border:1px solid var(--border);font-size:14px;cursor:pointer;color:var(--muted);padding:0;line-height:1;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center; }
  .modal-body { overflow-y:auto;flex:1; -webkit-overflow-scrolling:touch;touch-action:pan-y; }
  .modal-section { border-bottom:1px solid rgba(0,0,0,0.06); }
  .modal-section-hdr { padding:8px 20px;background:var(--surface2);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:2;border-bottom:1px solid var(--border); }
  .modal-section-name { font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted); }
  .modal-section-total { font-size:13px;font-weight:700;color:var(--green);font-family:var(--font-head); }
  .modal-row { display:flex;align-items:center;padding:10px 20px;gap:12px;border-bottom:0.5px solid rgba(0,0,0,0.05); }
  .modal-row-name { flex:1;font-size:14px;color:#333;min-width:0;line-height:1.3; }
  .modal-amount-inp { width:120px;text-align:right;font-size:16px;font-weight:700;font-family:var(--font-head);color:var(--accent);background:var(--accent-dim);border:2px solid transparent;border-radius:8px;padding:8px 12px;outline:none;flex-shrink:0;-webkit-appearance:none; }
  .modal-amount-inp:focus { border-color:var(--accent);background:#fff; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
  .modal-footer { padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center;flex-shrink:0;background:var(--surface2); }
  .modal-grand { flex:1;font-size:13px;color:var(--green);font-weight:600; }
  .modal-saved { font-size:12px;color:var(--green);opacity:0;transition:opacity 0.3s; }
  .modal-btn-save { background:var(--accent);color:#fff;border:none;border-radius:8px;padding:11px 22px;font-size:14px;font-weight:600;cursor:pointer;font-family:var(--font-body);white-space:nowrap; }
  .modal-btn-save:hover { background:#1d4ed8; }
  .modal-btn-cancel { background:var(--surface2);color:var(--muted);border:1px solid var(--border);border-radius:8px;padding:11px 16px;font-size:14px;cursor:pointer;font-family:var(--font-body); }
</style>
</head>
<body>
<noscript><p style="font-family:sans-serif;padding:40px;color:#333">JavaScript is required to run this dashboard.</p></noscript>
<header class="site-header">
  <div>
    <h1>Bains Family Dashboard</h1>
    <div class="sub">Financial overview · 2026</div>
  </div>
  <div id="header-nw" style="font-family:var(--font-head);font-size:0.78rem;color:var(--muted);"></div>
</header>
<main>
<div id="app">
  <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:60vh;gap:16px;">
    <div style="width:28px;height:28px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin 0.8s linear infinite;"></div>
    <div style="font-size:13px;color:var(--muted);">Loading dashboard…</div>
  </div>
</div>
</main>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyAyP4XFRDcP7Uutac_bYq5oo97CU4lrPCs",
  authDomain: "house-budget-67248.firebaseapp.com",
  projectId: "house-budget-67248",
  storageBucket: "house-budget-67248.firebasestorage.app",
  messagingSenderId: "860923969797",
  appId: "1:860923969797:web:8bb95e65eccfe492ab776c"
};
let app, db;
try {
  app = firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
} catch(e) {
  console.error("Firebase init failed:", e);
  document.getElementById("app").innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#a02020;"><strong>Failed to connect to database.</strong><br><small>' + e.message + '</small></div>';
}

const DEFAULTS = {
  home:   { label:"Home",                icon:"🏠", color:"#2a6e1e", items:[{name:"Mortgage",amount:3800},{name:"Utilities",amount:400},{name:"Property Tax",amount:720},{name:"Home Insurance",amount:132.55}] },
  subs:   { label:"Subscriptions",       icon:"📺", color:"#1a6b8a", items:[{name:"Gym (GoodLife)",amount:152},{name:"IPTV",amount:30},{name:"Home Security",amount:68},{name:"Netflix",amount:24},{name:"Amazon",amount:29},{name:"CAA",amount:20},{name:"Lottery",amount:20},{name:"Fubo",amount:17}] },
  phone:  { label:"Internet & Phone",    icon:"📱", color:"#6b3fa0", items:[{name:"Rogers (Internet & Home)",amount:113},{name:"Telus (Cell Phones)",amount:135.60}] },
  food:   { label:"Food & Home Supplies",icon:"🛒", color:"#a06b00", items:[{name:"Booster Juice",amount:80},{name:"A&W / McDonald's",amount:150},{name:"Grocery",amount:650},{name:"Costco",amount:250},{name:"Home Supplies",amount:250}] },
  auto:   { label:"Auto",                icon:"🚗", color:"#a02020", items:[{name:"Auto Insurance",amount:384.61},{name:"Gas",amount:450},{name:"407 ETR",amount:150}] },
  kids:   { label:"Kids Activities",     icon:"👧", color:"#7a3080", items:[{name:"Swimming",amount:100},{name:"Soccer",amount:74}] },
  invest: { label:"Investment",          icon:"📈", color:"#1a5280", items:[{name:"RESP",amount:580},{name:"BTC",amount:200},{name:"TFSA (Manny)",amount:1000},{name:"TFSA (Rani)",amount:0}] },
  other:  { label:"Others",              icon:"📦", color:"#555550", items:[{name:"House Cleaning",amount:200},{name:"Presto",amount:100},{name:"Life Insurance",amount:270},{name:"Gym (GoodLife)",amount:76},{name:"Enercare",amount:64},{name:"Claude AI",amount:27}] }
};
const CATEGORY_ORDER = ["home","kids","subs","auto","food","phone","invest","other"];
const fmt = n => "$" + Number(n).toLocaleString("en-CA", {minimumFractionDigits:0, maximumFractionDigits:2});
const sanitize = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function renderTopStrip() {
  const el = document.getElementById('top-strip-container');
  if (!el) return;
  const c = n => "$" + Math.round(n).toLocaleString("en-CA");

  // Pull live values from fsData
  const getRet = names => fsData.investments.retirement.items
    .filter(i => names.some(n => i.name.toUpperCase().includes(n.toUpperCase())))
    .reduce((s,i) => s+(parseFloat(i.amount)||0), 0);

  const tfsaManny = getRet(['TFSA','MANNY']) || getRet(['TFSA']);
  const rrspManny = fsData.investments.retirement.items
    .filter(i => (i.name.toUpperCase().includes('RSP') || i.name.toUpperCase().includes('RRSP')) && i.name.toUpperCase().includes('MANNY'))
    .reduce((s,i)=>s+(parseFloat(i.amount)||0),0) ||
    fsData.investments.retirement.items
    .filter(i => i.name.toUpperCase().includes('MANNY') && i.name.toUpperCase().includes('RBC'))
    .reduce((s,i)=>s+(parseFloat(i.amount)||0),0) ||
    67210;
  const rrspRani = fsData.investments.retirement.items
    .filter(i => (i.name.toUpperCase().includes('RSP') || i.name.toUpperCase().includes('RRSP')) && i.name.toUpperCase().includes('RANI'))
    .reduce((s,i)=>s+(parseFloat(i.amount)||0),0) ||
    fsData.investments.retirement.items
    .filter(i => i.name.toUpperCase().includes('RANI') && i.name.toUpperCase().includes('CIBC'))
    .reduce((s,i)=>s+(parseFloat(i.amount)||0),0) ||
    9696;
  const btcVal = getRet(['BTC']);
  const woodEquity = fsData.real_estate.woodstock.value - fsData.real_estate.woodstock.mortgage;
  const resp = fsData.investments.kids && fsData.investments.kids.items[0]
    ? parseFloat(fsData.investments.kids.items[0].amount)||0 : 43827;

  const cards = [
    { label:"TFSA (Manny)",    val:c(tfsaManny), sub:"TD"         },
    { label:"RRSP (Manny)",    val:c(rrspManny), sub:"RBC"        },
    { label:"RRSP (Rani)",     val:c(rrspRani),  sub:"CIBC"       },
    { label:"BTC",             val:c(btcVal),    sub:"Newton"     },
    { label:"Woodstock Equity",val:c(woodEquity),sub:"1/3 share"  },
    { label:"RESP",            val:c(resp),      sub:"Noor & Veer"},
  ];

  const rawTotal = tfsaManny + rrspManny + rrspRani + btcVal + woodEquity + resp;

  el.innerHTML = `
  <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:4px;">
    <span style="font-size:10px;text-transform:uppercase;letter-spacing:0.07em;color:#555550;">Portfolio snapshot</span>
    <div style="display:flex;align-items:baseline;gap:6px;">
      <span style="font-family:'DM Serif Display',serif;font-size:1.5rem;color:#2a6e1e;line-height:1;">${c(rawTotal)}</span>
      <span style="font-size:11px;color:#888;">total</span>
    </div>
  </div>
  <div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch;scrollbar-width:none;">
    ${cards.map(card=>`
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;min-width:120px;flex-shrink:0;">
      <div style="font-size:0.65rem;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);margin-bottom:5px;white-space:nowrap;">${card.label}</div>
      <div style="font-family:var(--font-head);font-size:1.1rem;font-weight:700;color:var(--text);line-height:1;">${card.val}</div>
      <div style="font-size:10px;color:var(--muted);margin-top:3px;">${card.sub}</div>
    </div>`).join('')}
  </div>`;
}
const secTotal = cat => cat.items.reduce((s,i) => s + (parseFloat(i.amount)||0), 0);
const grandTotal = data => CATEGORY_ORDER.filter(k=>data[k]).reduce((s,k) => s + secTotal(data[k]), 0);
let data = JSON.parse(JSON.stringify(DEFAULTS));
let editMode = false, chart = null, saveTimer = null, collapsedSections = {};

async function loadData() {
  try {
    const snap = await db.collection("budget").doc("main").get();
    if (snap.exists) {
      const saved = snap.data();
      console.log("Firebase loaded. Keys:", Object.keys(saved));
      if(saved.invest) console.log("Invest items:", JSON.stringify(saved.invest.items));
      // Merge: use saved data but ensure all DEFAULTS categories exist
      // and that each category has all default items if missing
      data = saved;
      // Ensure all categories exist
      Object.keys(DEFAULTS).forEach(key => {
        if (!data[key]) {
          data[key] = JSON.parse(JSON.stringify(DEFAULTS[key]));
        }
        // Ensure category has required metadata

  const labels = keys.map(k => data[k].label);

  chart = new Chart(canvas, {
    type: "doughnut",
    data: { labels, datasets: [{ data: values, backgroundColor: colors.map(c=>c+"cc"), borderColor: colors, borderWidth: 1.5, hoverOffset: 6 }] },
    options: {
      responsive: true, maintainAspectRatio: false, cutout: "68%",
      plugins: { legend: { display: false }, tooltip: {
        callbacks: { label: ctx => ` ${ctx.label}: ${fmt(ctx.raw)} (${total>0?(ctx.raw/total*100).toFixed(1):0}%)` },
        backgroundColor: "#fff", borderColor: "rgba(0,0,0,0.1)", borderWidth: 1, titleColor: "#0d0d0b", bodyColor: "#555550", padding: 10

}

// ============================================================
// TFSA SEQUENCING — single source of truth used by both
// Retirement Plan and Wedding Fund sections.
// TFSA grows at 5%, funds Noor's wedding (2048) first,
// then Veer's (2050), remainder rolls into retirement (2051).
// ============================================================
function calcTfsaSequence() {
  const tfsaNow = getTfsaBalance();
  const r = 0.05, inf = 0.025, baseYear = 2026, retYear = 2051;
  // Monthly TFSA contribution — combined from both budget lines (Manny + Rani)
  const tfsaMo = getTfsaMonthlyContrib();
  // FV with monthly contributions: PV grows + monthly contrib accumulates
  const fvTfsa = (pv, mo, years) => {
    const rm = r/12, nm = years*12;
    return pv*Math.pow(1+rm,nm) + mo*(Math.pow(1+rm,nm)-1)/rm;
  };
  const noorYear = new Date(wfData.noor.born).getFullYear() + wfData.noor.weddingAge;
  const veerYear = new Date(wfData.veer.born).getFullYear() + wfData.veer.weddingAge;
  const noorGoal = wfData.noor.goalToday * Math.pow(1+inf, noorYear - baseYear);
  const veerGoal = wfData.veer.goalToday * Math.pow(1+inf, veerYear - baseYear);
  // Step 1: grow to Noor's wedding with monthly contributions, pay her share
  const tfsaAtNoor  = fvTfsa(tfsaNow, tfsaMo, noorYear - baseYear);
  const noorSurplus = tfsaAtNoor - noorGoal;
  const afterNoor   = Math.max(0, noorSurplus);
  // Step 2: remainder grows to Veer's wedding (contributions continue), pay his share
  const tfsaAtVeer  = fvTfsa(afterNoor, tfsaMo, veerYear - noorYear);
  const veerSurplus = tfsaAtVeer - veerGoal;
  const afterVeer   = Math.max(0, veerSurplus);
  // Step 3: remainder + contributions grow to retirement
  const tfsaAtRetirement = fvTfsa(afterVeer, tfsaMo, retYear - veerYear);
  return { tfsaNow, tfsaMo, noorYear, veerYear, retYear,
           noorGoal, veerGoal,
           tfsaAtNoor, noorSurplus, afterNoor,
           tfsaAtVeer, veerSurplus, afterVeer,
           tfsaAtRetirement };
}

window.updateFsInv = (catKey, idx, field, val) => {
  if (field==="amount") {
    const p=parseFloat(val);
    if(val===''||val==='-') return;
    fsData.investments[catKey].items[idx].amount=isNaN(p)?0:p;
    // Update totals live WITHOUT re-rendering the whole section (would destroy the input)
    const catTotal = fsData.investments[catKey].items.reduce((s,i)=>s+(parseFloat(i.amount)||0),0);
    // Update any visible total displays
    saveFsData();
    refreshRetirementIfVisible();
  } else {
    fsData.investments[catKey].items[idx].name=val;
    saveFsData();
  }
};

window.confirmFsInvEdit = () => {
  window.fsActiveEdit=null;
  renderFsSection();
};
window.updateFsRe = (key, field, val) => {
  const p=parseFloat(val); if(val===''||val==='-')return;
  if(key==='woodstock' && (field==='fullValue'||field==='fullMortgage')) {
    // Store full value, auto-calculate 1/3 share
    fsData.real_estate.woodstock[field]=isNaN(p)?0:p;
    fsData.real_estate.woodstock.value   = Math.round(fsData.real_estate.woodstock.fullValue/3);
    fsData.real_estate.woodstock.mortgage= Math.round(fsData.real_estate.woodstock.fullMortgage/3);
    // Sync liabilities
    if(fsData.liabilities.mortgages.items[1]) fsData.liabilities.mortgages.items[1].amount=fsData.real_estate.woodstock.mortgage;
  } else {
    fsData.real_estate[key][field]=isNaN(p)?0:p;
    // Keep liabilities in sync with RE mortgages
    if(key==='primary'&&field==='mortgage') { if(fsData.liabilities.mortgages.items[0]) fsData.liabilities.mortgages.items[0].amount=isNaN(p)?0:p; }
    if(key==='woodstock'&&field==='mortgage') { if(fsData.liabilities.mortgages.items[1]) fsData.liabilities.mortgages.items[1].amount=isNaN(p)?0:p; }
  }
  saveFsData(); refreshRetirementIfVisible(); renderFsSection(); if(document.getElementById('mort-container')) renderMortSection();
};
window.updateFsLib = (idx, field, val) => {
  if (field==="amount") {
    const p=parseFloat(val); if(val===''||val==='-')return;
    fsData.liabilities.mortgages.items[idx].amount=isNaN(p)?0:p;
    if(idx===0) fsData.real_estate.primary.mortgage=isNaN(p)?0:p;
    if(idx===1) fsData.real_estate.woodstock.mortgage=isNaN(p)?0:p;
    saveFsData(); refreshRetirementIfVisible(); renderFsSection(); if(document.getElementById('mort-container')) renderMortSection();
  } else {
    fsData.liabilities.mortgages.items[idx].name=val;
    saveFsData();
  }
};
window.addFsInvItem = (catKey) => { fsData.investments[catKey].items.push({name:"New item",amount:0}); renderFsSection(); saveFsData(); };
window.removeFsInvItem = (catKey, idx) => { fsData.investments[catKey].items.splice(idx,1); renderFsSection(); saveFsData(); };
window.toggleFsEdit = () => requireEditPassword(() => { fsEditMode=!fsEditMode; window.fsActiveEdit=null; renderFsSection(); });

  const fmt=n=>"$"+Math.round(n).toLocaleString("en-CA");

  const tfsaNow=(bal.tfsa>0)?bal.tfsa:6735;
  const rppNow=(bal.rpp!=null)?bal.rpp:25979;
  const btcNow=(bal.btc!=null)?bal.btc:12000;
  const indiaNow=(bal.india!=null)?bal.india:300000;
  const woodNow=(bal.wood!=null)?bal.wood:216667;

  const rrsp65=fv(rrspNow,contrib.rrsp,r,yrs);
  // TFSA: grows sequentially — funds Noor (2048) then Veer (2050), remainder to retirement
  const tfsaSeq=calcTfsaSequence();
  const tfsa65=tfsaSeq.tfsaAtRetirement; // what's left for retirement after both weddings
  const rpp65=fv(rppNow,contrib.rpp,r,yrs);
  const btc65=btcNow*Math.pow(1+btcR,yrs);

  // Tax adjustment: RRSP + RPP are pre-tax — withdrawals taxed as income

const WF_DEFAULTS = {

let wfData = JSON.parse(JSON.stringify(WF_DEFAULTS));
let wfSaveTimer = null;

async function loadWfData() {
  try {
    const snap = await db.collection("budget").doc("weddingfund").get();
    if (snap.exists) {
      const d = snap.data();
      if (d.noor) wfData.noor = {...WF_DEFAULTS.noor, ...d.noor};
      if (d.veer) wfData.veer = {...WF_DEFAULTS.veer, ...d.veer};
    }
  } catch(e) {}
}
async function saveWfData() {
  clearTimeout(wfSaveTimer);
  wfSaveTimer = setTimeout(async () => {
    try {
      await db.collection("budget").doc("weddingfund").set(wfData);
      const el = document.getElementById("wf-saved");
      if (el) { el.style.opacity=1; setTimeout(()=>{el.style.opacity=0;},2000); }
    } catch(e) {}
  }, 800);
}
window.updateWf = (child, field, val) => {
  const parsed = parseFloat(val);
  if (val===''||val==='-') return;
  wfData[child][field] = isNaN(parsed) ? wfData[child][field] : parsed;
  // Don't re-render on every keystroke — just save
  saveWfData();
};

function renderNwSection() {
  const container = document.getElementById("nw-container");
  if (!container) return;
  const inf=0.025, r=0.05, baseYear=2026, retYear=2051;
  const fv=(pv,mo,rate,n)=>{const rm=rate/12,nm=n*12;return pv*Math.pow(1+rm,nm)+mo*(Math.pow(1+rm,nm)-1)/rm;};
  const TAX=0.25;

  // Current values from fsData
  const rrspNow = fsData.investments.retirement.items.filter(i=>i.name.toUpperCase().includes('RRSP')||i.name.toUpperCase().includes('RSP')).reduce((s,i)=>s+(parseFloat(i.amount)||0),0);
  const tfsaNow = fsData.investments.retirement.items.filter(i=>i.name.toUpperCase().includes('TFSA')).reduce((s,i)=>s+(parseFloat(i.amount)||0),0);
  const rppNow  = parseFloat((fsData.investments.retirement.items.find(i=>i.name.toUpperCase().includes('RPP'))||{amount:0}).amount)||0;
  const btcNow  = parseFloat((fsData.investments.retirement.items.find(i=>i.name.toUpperCase().includes('BTC'))||{amount:0}).amount)||0;
  const indiaNow= parseFloat((fsData.investments.others.items.find(i=>i.name.toUpperCase().includes('INDIA'))||{amount:0}).amount)||0;
  const respNow = fsData.investments.kids && fsData.investments.kids.items[0] ? parseFloat(fsData.investments.kids.items[0].amount)||0 : 0;
  const cashNow = fsData.investments.cash && fsData.investments.cash.items[0] ? parseFloat(fsData.investments.cash.items[0].amount)||0 : 0;
  const primVal = fsData.real_estate.primary.value;
  const primMort= fsData.real_estate.primary.mortgage;
  const woodVal = fsData.real_estate.woodstock.value;
  const woodMort= fsData.real_estate.woodstock.mortgage;

  const contribRrsp=1250, contribRpp=500, tfsaMo=1000;
  const mortPayment = primMort*0.005; // approx monthly payment

  // Build yearly projections
  const years = [];
  for (let y = baseYear; y <= retYear; y++) {
    const n = y - baseYear;
    const rrsp  = fv(rrspNow, contribRrsp, r, n)*(1-TAX);
    const tfsa  = fv(tfsaNow, tfsaMo, r, n);
    const rpp   = fv(rppNow,  contribRpp,  r, n)*(1-TAX);
    const btc   = btcNow*Math.pow(1.05,n);
    const india = indiaNow*Math.pow(1+inf,n);
    const wood  = woodVal*Math.pow(1+inf,n);
    const prim  = primVal*Math.pow(1+inf,n);
    const mort  = Math.max(0, primMort - (mortPayment*12*n*0.3)); // rough paydown
    const wMort = Math.max(0, woodMort - (woodMort/25*n));
    const resp  = fv(respNow, 580+83, r, Math.min(n,12));
    const liquid= rrsp+tfsa+rpp+btc+india+cashNow;
    const nwWith= liquid + prim + wood - mort - wMort;
    years.push({ y, nwWith: Math.round(nwWith/1000)*1000, liquid: Math.round(liquid/1000)*1000 });
  }

  // Fixed SVG chart using pixel coordinates (not percentages which break SVG)
  const SVG_W = 700, SVG_H = 200, PAD_B = 30;
  const maxNw = Math.max(...years.map(y=>y.nwWith));
  const barW = SVG_W / years.length;
  const milestones = {2038:true, 2048:true, 2050:true, 2051:true};
  const milestoneLabels = {2038:"2038",2048:"Noor",2050:"Veer",2051:"Retire"};

  const bars = years.map((y,i) => {
    const x = i * barW;
    const hNw  = ((y.nwWith  / maxNw) * (SVG_H - PAD_B)).toFixed(1);
    const hLiq = ((y.liquid   / maxNw) * (SVG_H - PAD_B)).toFixed(1);
    const bw = (barW * 0.45).toFixed(1);
    const isMilestone = milestones[y.y];
    return `
      <rect x="${(x+1).toFixed(1)}" width="${bw}" y="${(SVG_H-PAD_B-hNw).toFixed(1)}" height="${hNw}" fill="#2a6e1e" opacity="0.85" rx="1"/>
      <rect x="${(x+barW*0.48).toFixed(1)}" width="${bw}" y="${(SVG_H-PAD_B-hLiq).toFixed(1)}" height="${hLiq}" fill="#1a5280" opacity="0.6" rx="1"/>
      ${y.y%5===0 ? `<text x="${(x+barW/2).toFixed(1)}" y="${SVG_H}" text-anchor="middle" font-size="9" fill="#999">${y.y}</text>` : ''}
      ${isMilestone ? `
        <line x1="${(x+barW/2).toFixed(1)}" x2="${(x+barW/2).toFixed(1)}" y1="0" y2="${SVG_H-PAD_B}" stroke="#e08000" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.7"/>
        <text x="${(x+barW/2).toFixed(1)}" y="12" text-anchor="middle" font-size="8" fill="#a06000" font-weight="bold">${milestoneLabels[y.y]}</text>
      ` : ''}`;
  }).join('');

  const fmtM = n => {
    if (Math.abs(n) >= 1000000) return "$"+(n/1000000).toFixed(2)+"M";
    if (Math.abs(n) >= 1000) return "$"+Math.round(n/1000)+"K";
    return "$"+Math.round(n);
  };
  const current = years[0];
  const at2035 = years[9];
  const atRet  = years[years.length-1];

  container.innerHTML = `
    <div style="padding:12px 16px;border-bottom:1px solid rgba(0,0,0,0.08);background:#fafaf8;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
      <span style="font-size:11px;color:#aaa;">Projected growth · 5% investments · 2.5% real estate · 25% tax on RRSP/RPP</span>
      <div style="display:flex;gap:16px;font-size:11px;">
        <span><span style="display:inline-block;width:10px;height:10px;background:#2a6e1e;border-radius:2px;margin-right:4px;opacity:0.85;"></span>Net Worth</span>
        <span><span style="display:inline-block;width:10px;height:10px;background:#1a5280;border-radius:2px;margin-right:4px;opacity:0.7;"></span>Liquid only</span>
      </div>
    </div>
    <div style="padding:16px;">
      <svg viewBox="0 0 ${SVG_W} ${SVG_H+10}" style="width:100%;height:200px;display:block;overflow:visible;">
        ${bars}
      </svg>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;">
        ${[[2026,current],[2035,at2035],[2051,atRet]].map(([yr,d])=>`
        <div style="background:#fafaf8;border:1px solid rgba(0,0,0,0.08);border-radius:10px;padding:12px;">
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:#888;margin-bottom:6px;">${yr===2026?'Today':yr===2035?'2035 (mid)':'2051 (retire)'}</div>
          <div style="font-family:'DM Serif Display',serif;font-size:1.2rem;color:#2a6e1e;">${fmtM(d.nwWith)}</div>
          <div style="font-size:11px;color:#1a5280;margin-top:2px;">${fmtM(d.liquid)} liquid</div>
        </div>`).join('')}
      </div>
      <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:#a06000;">
        <span>⚡ 2038 — kids adults</span>
        <span>💒 2048/2050 — weddings</span>
        <span>🏖 2051 — retirement</span>
      </div>
    </div>`;
}

async function fetchTfsaPrice(ticker) {
  try {
    // Yahoo Finance CORS-friendly endpoint
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1d&range=1d`;
    const res = await fetch(url, {headers:{'Accept':'application/json'}});
    if (!res.ok) throw new Error(res.status);
    const json = await res.json();
    const meta = json.chart.result[0].meta;
    return {
      price: meta.regularMarketPrice,
      currency: meta.currency,
      name: meta.shortName || meta.longName || ticker,
    };
  } catch(e) {
    return null;
  }
}

function calcMortgage(balance, payment, rateAnnual, maturityYYYYMM, renewRateAnnual) {
  const today = new Date(2026, 3, 1); // April 2026
  const [mY, mM] = maturityYYYYMM.split('-').map(Number);
  const matDate = new Date(mY, mM-1, 1);
  const monthsToMat = Math.max(0, (matDate.getFullYear()-today.getFullYear())*12 + matDate.getMonth()-today.getMonth());

  // Amortize to maturity at current rate
  let bal = balance;
  const r1 = rateAnnual/100/12;
  for (let m = 0; m < monthsToMat; m++) {
    const interest = bal * r1;
    const principal = Math.max(0, payment - interest);
    bal = Math.max(0, bal - principal);
  }
  const balAtRenewal = bal;

  // After renewal: same payment, new rate
  const r2 = renewRateAnnual/100/12;
  let monthsAfter = 0;
  if (balAtRenewal > 0 && payment > balAtRenewal * r2) {
    monthsAfter = Math.log(payment/(payment - balAtRenewal*r2)) / Math.log(1+r2);
  }
  const payoffYear = mY + (mM-1)/12 + monthsAfter/12;
  const totalInterest = payment*(monthsToMat+monthsAfter) - balance;

  return { balAtRenewal, monthsToMat, monthsAfter, payoffYear, totalInterest };
}

    ? "border:1px solid rgba(42,110,30,0.35);background:rgba(42,110,30,0.1);color:#2a6e1e;"
    : "border:1px solid rgba(0,0,0,0.15);background:rgba(0,0,0,0.05);color:#333330;";
  container.innerHTML = `
    <div style="padding:12px 16px;border-bottom:1px solid rgba(0,0,0,0.08);background:#fafaf8;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
      <span style="font-size:11px;color:#aaa;">Uses your actual budget payment · update rate & maturity after each renewal</span>
      <div style="display:flex;align-items:center;gap:8px;">
        <span style="font-size:11px;color:#2a6e1e;font-weight:600;">Max 5yr term in Canada</span>
        <button onclick="toggleMortEdit()" style="font-family:inherit;font-size:12px;padding:5px 14px;border-radius:20px;cursor:pointer;${mortEditStyle}">${window.mortEditMode?"✓ Done":"✎ Edit"}</button>
      </div>
    </div>
    <div style="padding:16px;">
      ${mortCard("🏠 Primary Home (Ajax)", primVal, primMort, primPayment, prim, 'prim')}
      ${mortCard("🏘 Woodstock Rental (1/3 of $507,524 total @ 3.84% · 25y 8m remaining · payoff ~Jan 2052)", woodVal, woodMort, woodPayment, wood, 'wood')}
      <div style="padding:12px;background:#fafaf8;border-radius:8px;border:1px solid rgba(0,0,0,0.06);font-size:11px;color:#555;line-height:1.7;">
        💡 <strong>Combined equity: ${fmt((primVal-primMort)+(woodVal-woodMort))}</strong><br>
        Primary home paid off ~${payoffStr(prim.payoffYear)} · Total interest remaining ~${fmt(prim.totalInterest)}<br>
        Each renewal: update the rate and maturity date above — recalculates instantly
      </div>
    </div>`;
}

// ============================================================
// BTC TRACKER
// ============================================================
// BTC quantity stored in Firebase (cross-device)
if (!window.btcQtyHeld) window.btcQtyHeld = 0;
window.saveBtcQty = async (qty) => {
  window.btcQtyHeld = qty;
  try { await db.collection("budget").doc("settings").set({btcQty: qty, mortSettings: window.mortSettings||{}}, {merge:true}); } catch(e) {}
};
// Load BTC qty from Firebase on startup
async function loadSettings() {
  try {
    const snap = await db.collection("budget").doc("settings").get();
    if (snap.exists) {
      const d = snap.data();
      if (d.btcQty !== undefined) window.btcQtyHeld = parseFloat(d.btcQty)||0;
      if (d.mortSettings) window.mortSettings = d.mortSettings;
      if (d.tfsaHoldings) window.tfsaHoldings = d.tfsaHoldings;
    }
  } catch(e) {}
}

async function renderBtcSection() {
  const container = document.getElementById("btc-container");
  if (!container) return;
  const fmt = n => "$"+Math.round(n).toLocaleString("en-CA");

  container.innerHTML = `
    <div style="padding:12px 16px;border-bottom:1px solid rgba(0,0,0,0.08);background:#fafaf8;">
      <span style="font-size:11px;color:#aaa;">Enter your BTC amount — system calculates CAD value live</span>
    </div>
    <div style="padding:20px;text-align:center;">
      <div style="font-size:13px;color:#aaa;">Loading BTC price…</div>
    </div>`;

  try {
    const res = await fetch("https://api.coinbase.com/v2/prices/BTC-CAD/spot");
    const json = await res.json();
    const price = parseFloat(json.data.amount);
    const btcQty = window.btcQtyHeld || 0;
    const cadValue = Math.round(btcQty * price);
    const scenarios = [
      {label:"Bear (-50%)", price:price*0.5, color:"#a02020"},
      {label:"Current", price:price, color:"#1a5280"},
      {label:"Bull (+100%)", price:price*2, color:"#2a6e1e"},
      {label:"Moon (+300%)", price:price*4, color:"#7a3080"},
    ];

    container.innerHTML = `
      <div style="padding:12px 16px;border-bottom:1px solid rgba(0,0,0,0.08);background:#fafaf8;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <span style="font-size:11px;color:#aaa;">Live BTC/CAD via Coinbase · updates on page load</span>
        <span style="font-size:11px;color:#2a6e1e;font-weight:600;">1 BTC = ${fmt(price)}</span>
      </div>
      <div style="padding:16px;">

        <div style="background:#faf5ff;border:1px solid rgba(122,48,128,0.25);border-radius:12px;padding:16px;margin-bottom:20px;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
            <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:#7a3080;">Your BTC Holdings</div>
            <div style="display:flex;gap:8px;">
              <button id="btc-edit-btn" onclick="(function(){
                document.getElementById('btc-display-row').style.display='none';
                document.getElementById('btc-input-row').style.display='flex';
                document.getElementById('btc-edit-btn').style.display='none';
                document.getElementById('btc-save-btn').style.display='inline-block';
                document.getElementById('btc-qty-input').focus();
              })()" style="font-family:inherit;font-size:12px;padding:5px 14px;border-radius:20px;cursor:pointer;border:1px solid rgba(122,48,128,0.3);background:rgba(122,48,128,0.08);color:#7a3080;">✎ Edit</button>
              <button id="btc-save-btn" onclick="(function(){
                document.getElementById('btc-display-row').style.display='flex';
                document.getElementById('btc-input-row').style.display='none';
                document.getElementById('btc-save-btn').style.display='none';
                document.getElementById('btc-edit-btn').style.display='inline-block';
              })()" style="display:none;font-family:inherit;font-size:12px;padding:5px 14px;border-radius:20px;cursor:pointer;border:none;background:#7a3080;color:#fff;">✓ Save</button>
            </div>
          </div>
          <div id="btc-display-row" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px;">
            <div style="background:#fff;border:1.5px solid rgba(122,48,128,0.15);border-radius:10px;padding:10px 14px;flex:1;min-width:120px;">
              <div style="font-size:10px;color:#aaa;margin-bottom:3px;">BTC Amount</div>
              <div id="btc-qty-display" style="font-family:'DM Serif Display',serif;font-size:1.1rem;color:#7a3080;">${btcQty>0?(btcQty.toFixed(4)+' BTC'):'Tap ✎ Edit to enter'}</div>
            </div>
            <div style="font-size:13px;color:#aaa;flex-shrink:0;">→</div>
            <div style="background:#fff;border:1.5px solid rgba(122,48,128,0.15);border-radius:10px;padding:10px 14px;flex:1;min-width:120px;">
              <div style="font-size:10px;color:#aaa;margin-bottom:3px;">Live CAD Value</div>
              <div id="btc-cad-live" style="font-family:'DM Serif Display',serif;font-size:1.1rem;color:${btcQty>0?'#7a3080':'#aaa'};">${btcQty>0?fmt(cadValue)+' CAD':'—'}</div>
            </div>
          </div>
          <div id="btc-input-row" style="display:none;align-items:center;gap:8px;margin-bottom:8px;">
            <div style="display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid rgba(122,48,128,0.4);border-radius:10px;padding:10px 14px;flex:1;">
              <span style="font-size:14px;color:#7a3080;font-weight:700;">₿</span>
              <input id="btc-qty-input" type="number" inputmode="decimal" step="0.0001"
                value="${btcQty||''}" placeholder="e.g. 0.25"
                onfocus="this.select()"
                oninput="(function(v){
                  const q=parseFloat(v)||0;
                  window.saveBtcQty(q);
                  const p=${price};
                  const cad=Math.round(q*p);
                  document.getElementById('btc-qty-display').textContent=q>0?(q.toFixed(4)+' BTC'):'Tap ✒ Edit to enter';
                  document.getElementById('btc-cad-live').textContent=q>0?('$'+cad.toLocaleString('en-CA')+' CAD'):'—';
                  document.getElementById('btc-cad-live').style.color=q>0?'#7a3080':'#aaa';
                  ${scenarios.map((s,i)=>`document.getElementById('btc-sc-${i}').textContent=q>0?('$'+(Math.round(q*${s.price})).toLocaleString('en-CA')):'—';`).join('')}
                  const btcItem=fsData.investments.retirement.items.find(i=>i.name.toUpperCase().includes('BTC'));
                  if(btcItem){btcItem.amount=cad;saveFsData();}
                })(this.value)"
                style="flex:1;font-size:16px;font-weight:700;font-family:inherit;color:#7a3080;background:transparent;border:none;outline:none;padding:2px 0;">
              <span style="font-size:12px;color:#aaa;">BTC</span>
            </div>
          </div>
          <div style="font-size:11px;color:#888;">Auto-updates Financial Summary · saved locally on this device</div>
        </div>

        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px;">
          <div style="background:#fafaf8;border:1px solid rgba(0,0,0,0.08);border-radius:10px;padding:12px;text-align:center;">
            <div style="font-size:10px;color:#888;margin-bottom:4px;">BTC Price (CAD)</div>
            <div style="font-family:'DM Serif Display',serif;font-size:1.1rem;color:#7a3080;">${fmt(price)}</div>
          </div>
          <div style="background:#fafaf8;border:1px solid rgba(0,0,0,0.08);border-radius:10px;padding:12px;text-align:center;">
            <div style="font-size:10px;color:#888;margin-bottom:4px;">Your BTC</div>
            <div style="font-family:'DM Serif Display',serif;font-size:1.1rem;color:#7a3080;">${btcQty>0?btcQty.toFixed(4)+' BTC':'—'}</div>
          </div>
          <div style="background:#f0f7ee;border:1px solid rgba(42,110,30,0.2);border-radius:10px;padding:12px;text-align:center;">
            <div style="font-size:10px;color:#888;margin-bottom:4px;">Current Value</div>
            <div style="font-family:'DM Serif Display',serif;font-size:1.1rem;color:#2a6e1e;">${btcQty>0?fmt(cadValue):'—'}</div>
          </div>
        </div>

        <div style="font-size:12px;font-weight:600;color:#555;margin-bottom:10px;">Price Scenarios</div>
        <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;">
          ${scenarios.map((s,i)=>`
          <div style="background:#fafaf8;border:1px solid rgba(0,0,0,0.08);border-radius:10px;padding:12px;text-align:center;">
            <div style="font-size:10px;color:#888;margin-bottom:4px;">${s.label}</div>
            <div id="btc-sc-${i}" style="font-family:'DM Serif Display',serif;font-size:1rem;color:${s.color};">${btcQty>0?fmt(btcQty*s.price):'—'}</div>
            <div style="font-size:10px;color:#aaa;margin-top:2px;">${fmt(s.price)}/BTC</div>
          </div>`).join('')}
        </div>
        <div style="margin-top:12px;padding:10px 14px;background:#fafaf8;border-radius:8px;border:1px solid rgba(0,0,0,0.06);font-size:11px;color:#555;line-height:1.6;">
          💡 At 5%/yr, ${btcQty>0?fmt(cadValue):'"your BTC"'} grows to <strong>${btcQty>0?fmt(cadValue*Math.pow(1.05,25)):'—'}</strong> by 2051 in nominal terms.
        </div>
      </div>`;

    // No auto-focus — don't steal scroll position on page load

  } catch(e) {
    container.innerHTML = `
      <div style="padding:12px 16px;border-bottom:1px solid rgba(0,0,0,0.08);background:#fafaf8;">
        <span style="font-size:11px;color:#aaa;">BTC Tracker — could not load live price</span>
      </div>
      <div style="padding:20px;">
        <div style="font-size:13px;color:#a02020;margin-bottom:8px;">Could not load live BTC price — check connection.</div>
        <div style="font-size:12px;color:#555;margin-top:8px;">Enter your BTC quantity below and we'll calculate when price loads:</div>
        <input type="number" inputmode="decimal" placeholder="e.g. 0.25" value="${window.btcQtyHeld||''}"
          oninput="window.saveBtcQty(parseFloat(this.value)||0)"
          style="margin-top:10px;padding:8px 14px;font-size:16px;border:1px solid rgba(0,0,0,0.2);border-radius:8px;width:min(160px,50vw);font-family:inherit;">
      </div>`;
  }
}
</script>
